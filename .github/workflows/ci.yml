name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    #Tests PHP et Symfony
    symfony-tests:
        name: Symfony Tests (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: symfony
                    POSTGRES_PASSWORD: symfony
                    POSTGRES_DB: symfony_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ctype, iconv, pdo, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

            - name: Setup environment
              run: |
                  # Temporarily remove webpack_encore config to avoid missing bundle error
                  mv config/packages/webpack_encore.yaml config/packages/webpack_encore.yaml.bak || true
                  php bin/console cache:clear --env=test --no-interaction
                  mv config/packages/webpack_encore.yaml.bak config/packages/webpack_encore.yaml || true
              env:
                  APP_ENV: test

            - name: Check Symfony requirements
              run: vendor/bin/requirements-checker || true

            - name: Validate composer.json and composer.lock
              run: composer validate || true

            - name: Check for security vulnerabilities
              run: |
                  composer audit || true

            - name: Run PHPUnit tests
              run: |
                  php bin/phpunit --testdox
              env:
                  APP_ENV: test
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony_test?serverVersion=16&charset=utf8

            - name: Check Symfony security
              run: |
                  symfony check:security || composer audit || echo "Security check skipped"

    #Code Quality PHP
    php-code-quality:
        name: PHP Code Quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: ctype, iconv
                  coverage: none
                  tools: composer:v2, cs-fixer, phpstan

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

            - name: Setup environment
              run: |
                  # Temporarily remove webpack_encore config to avoid missing bundle error
                  mv config/packages/webpack_encore.yaml config/packages/webpack_encore.yaml.bak || true
                  php bin/console cache:clear --env=test --no-interaction
                  mv config/packages/webpack_encore.yaml.bak config/packages/webpack_encore.yaml || true
              env:
                  APP_ENV: test

            - name: Check PHP syntax
              run: |
                  find src -name "*.php" -print0 | xargs -0 -n1 php -l

            - name: Lint Twig templates
              run: |
                  php bin/console lint:twig templates/
              env:
                  APP_ENV: test

            - name: Lint YAML files
              run: |
                  php bin/console lint:yaml config/
              env:
                  APP_ENV: test

            - name: Lint container
              run: |
                  php bin/console lint:container
              env:
                  APP_ENV: test

    #Frontend Assets
    frontend-build:
        name: Frontend Build & Assets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: ctype, iconv
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

            - name: Verify WebpackEncoreBundle registration
              run: |
                  # Check if WebpackEncoreBundle is in bundles.php
                  if ! grep -q "WebpackEncoreBundle" config/bundles.php; then
                    echo "Adding WebpackEncoreBundle to bundles.php"
                    # Backup the file
                    cp config/bundles.php config/bundles.php.bak
                    # Add the bundle before the closing bracket
                    sed -i "s/];/    Symfony\\\\WebpackEncoreBundle\\\\WebpackEncoreBundle::class => ['all' => true],\n];/" config/bundles.php
                  fi
                  cat config/bundles.php

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install npm dependencies
              run: npm install

            - name: Build assets (development)
              run: npm run dev

            - name: Build assets (production)
              run: npm run build

            - name: Check for build artifacts
              run: |
                  if [ ! -f "public/build/manifest.json" ]; then
                    echo "Error: manifest.json not found!"
                    exit 1
                  fi
                  if [ ! -f "public/build/entrypoints.json" ]; then
                    echo "Error: entrypoints.json not found!"
                    exit 1
                  fi

    #Database & Doctrine
    doctrine-validation:
        name: Doctrine Schema Validation
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: symfony
                    POSTGRES_PASSWORD: symfony
                    POSTGRES_DB: symfony_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: ctype, iconv, pdo, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

            - name: Setup environment
              run: |
                  # Temporarily remove webpack_encore config to avoid missing bundle error
                  mv config/packages/webpack_encore.yaml config/packages/webpack_encore.yaml.bak || true
                  php bin/console cache:clear --env=test --no-interaction
                  mv config/packages/webpack_encore.yaml.bak config/packages/webpack_encore.yaml || true
              env:
                  APP_ENV: test
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony_test?serverVersion=16&charset=utf8

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U symfony; do
                    echo "Waiting for postgres..."
                    sleep 2
                  done

            - name: Create database
              run: |
                  php bin/console doctrine:database:create --env=test --if-not-exists
              env:
                  APP_ENV: test
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony_test?serverVersion=16&charset=utf8

            - name: Run migrations
              run: |
                  php bin/console doctrine:migrations:migrate --no-interaction --env=test --allow-no-migration
              env:
                  APP_ENV: test
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony_test?serverVersion=16&charset=utf8

            - name: Validate Doctrine mapping
              run: |
                  php bin/console doctrine:schema:validate --skip-sync --env=test
              env:
                  APP_ENV: test
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony_test?serverVersion=16&charset=utf8
