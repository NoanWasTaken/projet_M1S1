name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    APP_ENV: test
    APP_SECRET: ci_secret
    DATABASE_URL: postgresql://symfony:symfony@127.0.0.1:5432/symfony?serverVersion=16&charset=utf8
    DEFAULT_URI: http://localhost
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    MAILER_DSN: null://null
    MAILER_FROM_EMAIL: test@example.com
    MAILER_FROM_NAME: GearforgeTest
    OPENAI_API_KEY: sk-test
    OPENAI_MODEL: gpt-4o-mini
    CHATBOT_SYSTEM_MESSAGE: test
    STRIPE_SECRET_KEY: sk_test_placeholder
    STRIPE_PUBLIC_KEY: pk_test_placeholder
    N8N_API_KEY: test
    N8N_WEBHOOK_URL: http://localhost
    STOCK_ALERT_THRESHOLD: "10"

jobs:
    #Tests PHP et Symfony
    php-code-quality:
        name: PHP Code Quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: ctype, iconv
                  coverage: none
                  tools: composer:v2, cs-fixer, phpstan

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Validate composer.json and composer.lock
              run: composer validate --strict || true

            - name: Check for security vulnerabilities
              run: composer audit || true

            - name: Check PHP syntax
              run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

            - name: Lint Twig templates
              run: php bin/console lint:twig templates/

            - name: Lint YAML files
              run: php bin/console lint:yaml config/

            - name: Lint container
              run: php bin/console lint:container

    frontend-build:
        name: Frontend Build & Assets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install npm dependencies
              run: npm ci

            - name: Build assets with Vite
              run: npm run build

            - name: Check for build artifacts
              run: |
                  if [ ! -d "public/build" ]; then
                    echo "Error: public/build directory not found!"
                    exit 1
                  fi
                  if [ ! -f "public/build/.vite/manifest.json" ]; then
                    echo "Error: Vite manifest.json not found!"
                    exit 1
                  fi

    symfony-tests:
        name: Symfony Tests (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest
        needs: [php-code-quality]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: symfony
                    POSTGRES_PASSWORD: symfony
                    POSTGRES_DB: symfony_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ctype, iconv, pdo, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Check Symfony requirements
              run: vendor/bin/requirements-checker || true

            - name: Create test database and run migrations
              run: |
                  php bin/console doctrine:database:create --env=test --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction --env=test --allow-no-migration
              env:
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony?serverVersion=16&charset=utf8

            - name: Run PHPUnit tests
              run: php bin/phpunit --testdox
              env:
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony?serverVersion=16&charset=utf8

            - name: Check Symfony security
              run: symfony check:security || composer audit || echo "Security check skipped"

    doctrine-validation:
        name: Doctrine Schema Validation
        runs-on: ubuntu-latest
        needs: [php-code-quality]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: symfony
                    POSTGRES_PASSWORD: symfony
                    POSTGRES_DB: symfony_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: ctype, iconv, pdo, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U symfony; do
                    echo "Waiting for postgres..."
                    sleep 2
                  done

            - name: Create database and run migrations
              run: |
                  php bin/console doctrine:database:create --env=test --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction --env=test --allow-no-migration
              env:
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony?serverVersion=16&charset=utf8

            - name: Validate Doctrine mapping
              run: php bin/console doctrine:schema:validate --skip-sync --env=test
              env:
                  DATABASE_URL: postgresql://symfony:symfony@localhost:5432/symfony?serverVersion=16&charset=utf8
