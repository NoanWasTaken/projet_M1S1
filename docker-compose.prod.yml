services:
    app:
        # L'image sera automatiquement mise à jour par Watchtower
        image: ghcr.io/noanwastaken/projet_m1s1:latest
        container_name: symfony_app
        restart: unless-stopped
        networks:
            - web
            - db_net
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DATABASE_URL: postgresql://${POSTGRES_USER:-$POSTGRES_USR}:${POSTGRES_PWD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
            MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
            MAILER_DSN: ${MAILER_DSN}
            MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL}
            MAILER_FROM_NAME: ${MAILER_FROM_NAME}
            DEFAULT_URI: ${DEFAULT_URI}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            OPENAI_MODEL: ${OPENAI_MODEL}
            CHATBOT_SYSTEM_MESSAGE: ${CHATBOT_SYSTEM_MESSAGE}
            STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
            N8N_API_KEY: ${N8N_API_KEY}
            N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
            STOCK_ALERT_THRESHOLD: ${STOCK_ALERT_THRESHOLD:-10}
        depends_on:
            database:
                condition: service_healthy
        labels:
            - "com.centurylinklabs.watchtower.enable=true"

    messenger_worker:
        image: ghcr.io/noanwastaken/projet_m1s1:latest
        container_name: symfony_worker
        restart: unless-stopped
        command: php bin/console messenger:consume async --time-limit=3600 -vv
        networks:
            - db_net
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DATABASE_URL: postgresql://${POSTGRES_USER:-$POSTGRES_USR}:${POSTGRES_PWD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
            MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
            MAILER_DSN: ${MAILER_DSN}
            MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL}
            MAILER_FROM_NAME: ${MAILER_FROM_NAME}
            DEFAULT_URI: ${DEFAULT_URI}
        depends_on:
            database:
                condition: service_healthy
        labels:
            - "com.centurylinklabs.watchtower.enable=true"

    database:
        image: postgres:16-alpine
        container_name: symfony_db
        restart: unless-stopped
        # Port non exposé publiquement en production — accès interne uniquement via db_net
        expose:
            - "5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PWD}
            POSTGRES_USER: ${POSTGRES_USER:-$POSTGRES_USR}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-d",
                    "${POSTGRES_DB}",
                    "-U",
                    "${POSTGRES_USER:-$POSTGRES_USR}",
                ]
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
        networks:
            - db_net

volumes:
    database_data:

networks:
    web:
        external: true
    db_net:
        driver: bridge
